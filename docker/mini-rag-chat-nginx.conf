# Mini RAG Chat Nginx 配置文件

upstream mini_rag_backend {
    server 127.0.0.1:5000;
    # 如果使用 Docker，可以改为：
    # server mini-rag-chat:5000;
    keepalive 32;
}

server {
    listen 80;
    # 如果需要 HTTPS，取消下面的注释并配置证书路径
    # listen 443 ssl http2;
    
    # 修改为您的域名，或使用 _ 表示接受所有域名
    server_name _;
    # server_name your-domain.com www.your-domain.com;
    
    # 日志配置
    access_log /var/log/nginx/mini-rag-chat-access.log;
    error_log /var/log/nginx/mini-rag-chat-error.log;
    
    # 客户端最大请求体大小（用于上传文档等）
    client_max_body_size 50M;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # 基础代理头设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    
    # SSL 配置（如果启用 HTTPS，取消下面的注释）
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # add_header Strict-Transport-Security "max-age=31536000" always;
    # error_page 497 https://$host$request_uri;
    
    # 健康检查接口
    location /health {
        proxy_pass http://mini_rag_backend/health;
        access_log off;
    }
    
    # 统计接口
    location /stats {
        proxy_pass http://mini_rag_backend/stats;
    }
    
    # Mini RAG Chat 流式接口（Server-Sent Events）
    location /chat/stream {
        proxy_pass http://mini_rag_backend/chat/stream;
        
        # 流式响应关键配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        
        # 支持 Server-Sent Events
        proxy_set_header Cache-Control no-cache;
        proxy_set_header X-Accel-Buffering no;
        
        # 流式接口需要更长的超时时间
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 保持连接
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
    
    # Mini RAG Chat 前端页面和 API
    location / {
        proxy_pass http://mini_rag_backend/;
        
        # WebSocket 支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # 静态文件缓存（如果前端有静态资源）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://mini_rag_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 禁止访问敏感文件
    location ~ ^/(\.git|\.env|\.svn|\.htaccess|\.user\.ini) {
        deny all;
        return 404;
    }
    
    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

